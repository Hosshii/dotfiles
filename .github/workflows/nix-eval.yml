name: Nix flake checks

on:
  pull_request:
    paths:
      - "nix/**"
      - ".github/dependabot.yml"
      - ".github/workflows/nix-eval.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Evaluate all systems
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0
      - name: Run flake checks
        working-directory: nix
        run: >-
          nix flake check
          --all-systems --no-build --keep-going
          --no-update-lock-file --no-accept-flake-config .
