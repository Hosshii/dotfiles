version: 2
updates:
  - package-ecosystem: nix
    directory: /nix
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      flake-inputs:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
